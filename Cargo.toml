[package]
name = "mpb"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
description = "Thin alias of indicatif so the quant1x/mpb language ports share one crate name"
keywords = ["cli", "progress", "pb", "progressbar"]
categories = ["command-line-interface"]
license = "MIT"
repository = "https://github.com/quant1x/mpb"

[lib]
name = "mpb"
path = "lib.rs"

[dependencies]
indicatif = "0.18.6"

# Every feature is forwarded to indicatif unchanged; this crate adds no code.
[features]
default = ["indicatif/default"]
unicode-width = ["indicatif/unicode-width"]
improved_unicode = ["indicatif/improved_unicode"]
in_memory = ["indicatif/in_memory"]
futures = ["indicatif/futures"]
wasmbind = ["indicatif/wasmbind"]
rayon = ["indicatif/rayon"]
tokio = ["indicatif/tokio"]
